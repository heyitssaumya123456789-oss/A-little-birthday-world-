<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Birthday World 🌻</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background:
        radial-gradient(circle at 75% 35%, rgba(255,210,150,.35), transparent 20%),
        linear-gradient(145deg, #07152e 0%, #102f62 38%, #6d6a9d 70%, #f2b978 100%);
    color: white;
}

/* stars */
.star {
    position: absolute;
    color: white;
    font-size: 18px;
    animation: twinkle 2.5s infinite alternate;
}

.s1 { top: 12%; left: 12%; }
.s2 { top: 24%; left: 72%; animation-delay: .5s; }
.s3 { top: 15%; left: 88%; animation-delay: 1s; }
.s4 { top: 42%; left: 20%; animation-delay: 1.5s; }
.s5 { top: 55%; left: 80%; animation-delay: .8s; }

@keyframes twinkle {
    from { opacity: .3; transform: scale(.8); }
    to { opacity: 1; transform: scale(1.2); }
}

/* moon */
.moon {
    position: absolute;
    right: 14%;
    top: 20%;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #fff4cf;
    box-shadow: 0 0 35px rgba(255,240,190,.35);
}

.moon:after {
    content: "";
    position: absolute;
    left: -13px;
    top: -5px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #193c72;
}

/* sunflower decorations */
.sunflower {
    position: absolute;
    font-size: 65px;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.25));
}

.flower1 {
    bottom: 8%;
    left: 4%;
    transform: rotate(-10deg);
}

.flower2 {
    bottom: 12%;
    left: 12%;
    font-size: 45px;
    transform: rotate(12deg);
}

.flower3 {
    right: 4%;
    bottom: 8%;
    font-size: 48px;
    transform: rotate(10deg);
}

/* little date */
.date {
    position: absolute;
    right: 8%;
    top: 7%;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    transform: rotate(-4deg);
}

/* main content */
.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    position: relative;
    z-index: 5;
}

.small-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(22px, 4vw, 30px);
    margin-bottom: 15px;
    letter-spacing: 1px;
}

.small-title span {
    display: inline-block;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { transform: scale(1.15); }
}

h1 {
    font-family: 'Caveat', cursive;
    font-size: clamp(55px, 11vw, 105px);
    font-weight: 600;
    line-height: .9;
    text-shadow: 0 5px 25px rgba(0,0,0,.18);
}

.name {
    color: #ffd979;
    margin-top: 12px;
}

.subtitle {
    font-size: clamp(14px, 3vw, 20px);
    margin-top: 30px;
    font-weight: 300;
    letter-spacing: .5px;
}

/* loading bar */
.loading-area {
    margin-top: 38px;
}

.loading-bar {
    width: min(340px, 70vw);
    height: 13px;
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 20px;
    padding: 2px;
    overflow: hidden;
}

.loading-fill {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #ffd66f, #fff1b2);
    animation: loading 3s ease-in-out;
    transform-origin: left;
}

@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

.loading-text {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    margin-top: 8px;
}

/* button */
.enter-btn {
    margin-top: 35px;
    padding: 13px 30px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 30px;
    background: rgba(255,255,255,.12);
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: .3s;
}

.enter-btn:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.22);
}

/* bottom notebook */
.note {
    position: absolute;
    bottom: 4%;
    right: 7%;
    width: 180px;
    padding: 18px;
    background: #f3d3bd;
    color: #4c3540;
    font-family: 'Caveat', cursive;
    font-size: 17px;
    transform: rotate(4deg);
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
}

.note::before {
    content: "♡";
    position: absolute;
    top: -18px;
    left: 45%;
    font-size: 25px;
    color: white;
}

/* bottom books */
.books {
    position: absolute;
    bottom: 2%;
    left: 5%;
    font-family: 'Caveat', cursive;
    font-size: 18px;
}

.book {
    width: 170px;
    padding: 8px 12px;
    margin-top: 3px;
    background: rgba(20,35,60,.8);
    box-shadow: 0 5px 10px rgba(0,0,0,.2);
}

/* mobile */
@media (max-width: 600px) {

    .moon {
        width: 48px;
        height: 48px;
        right: 10%;
        top: 17%;
    }

    .moon:after {
        width: 48px;
        height: 48px;
    }

    .flower1 {
        font-size: 48px;
    }

    .flower2 {
        display: none;
    }

    .note {
        display: none;
    }

    .books {
        left: 3%;
        bottom: 3%;
        transform: scale(.75);
        transform-origin: bottom left;
    }

    .date {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">✦</div>
<div class="star s4">✧</div>
<div class="star s5">✦</div>

<div class="moon"></div>

<div class="date">12 October ♡</div>

<div class="sunflower flower1">🌻</div>
<div class="sunflower flower2">🌻</div>
<div class="sunflower flower3">🌻</div>

<div class="books">
    <div class="book">Good Things ✦</div>
    <div class="book">Take Your Time ♡</div>
    <div class="book">You Got This!</div>
</div>

<div class="note">
    Today:
    <br>
    Be happy.
    <br>
    Feel loved.
    <br>
    Dream BIG.
    <br>
    ♡
</div>

<main class="container">

    <div class="small-title">
        Someone has a birthday today... <span>👀</span>
    </div>

    <h1>
        Happy Birthday,
        <div class="name">Sadhana!</div>
    </h1>

    <div class="subtitle">
        This little world is made just for you ♡
    </div>

    <div class="loading-area">

        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>

        <div class="loading-text">
            loading happiness... 🌻
        </div>

    </div>

    <button class="enter-btn" onclick="enterWorld()">
        Enter your little world ✨
    </button>

</main>

<script>
function enterWorld() {
    alert("Okayyy birthday girl... your little world is waiting for you 🌻🩵✨");
}
</script>

</body>
</html>
